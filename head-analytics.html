<!-- Plausible Analytics — cookieless and privacy-preserving: no cookies, no
     cross-site tracking, no personal data collected, so it needs no consent
     banner under GDPR/CCPA. Loads deferred so it never blocks rendering, and
     the site degrades silently if the script is blocked or fails.

     The `outbound-links` variant also records clicks that leave the site,
     which is what most of this site's calls to action are: GitHub, LinkedIn,
     email, and the Linguistic Semantic Chunking demo. Swap the src to
     https://plausible.io/js/script.js for pageviews only.

     Requires biscuitsandgravy.ai to be added as a site in the Plausible
     dashboard; until then the script loads but no stats are recorded. -->
<script defer data-domain="biscuitsandgravy.ai" src="https://plausible.io/js/script.outbound-links.js"></script>
